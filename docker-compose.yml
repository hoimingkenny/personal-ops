services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibe_trading
      POSTGRES_USER: vibe_trading
      POSTGRES_PASSWORD: vibe_trading
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_trading -d vibe_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
